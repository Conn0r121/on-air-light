# On-Air Light automations.
# Loaded from configuration.yaml via `automation: !include automations.yaml`.
#
# Two automations:
#   1. mic webhook -> per-PC mic booleans   (stores each PC's mic state)
#   2. calendar OR any mic -> light         (the actual on-air logic)

# ------------------------------------------------------------------------------
# 1. Mirror each PC's mic state into its own input_boolean.
#
# windows-mic-detector/mic_watcher.ps1 runs on every PC you care about and
# POSTs {"active": true|false, "source": "<name>"} to:
#   http://<pi-ip>:8123/api/webhook/mic_active
#
# "source" is the $SourceName set at the top of the script on that PC and maps
# to the entity input_boolean.mic_active_<source>. Giving each PC its own
# boolean keeps their idle heartbeats from stomping on each other's state.
#
# To add another PC:
#   1. add its name to the allowed-sources list below,
#   2. define input_boolean.mic_active_<name> in input_boolean_test.yaml,
#   3. add the new boolean to the triggers AND the template in automation 2,
#   4. set $SourceName on that PC's copy of mic_watcher.ps1.
# ------------------------------------------------------------------------------
- id: on_air_mic_webhook_sync
  alias: "On-Air: mic webhook -> per-PC mic booleans"
  mode: queued
  max: 10
  triggers:
    - trigger: webhook
      webhook_id: mic_active  # one shared webhook; PCs identify via "source"
      allowed_methods:
        - POST
      local_only: true        # only accept POSTs from the local network
  actions:
    - variables:
        source: "{{ trigger.json.source | default('unknown') }}"
        active: "{{ trigger.json.active | default(false) | bool(false) }}"
    # Drop posts from unknown sources (typo'd $SourceName, stray requests).
    - condition: template
      value_template: "{{ source in ['laptop', 'gaming'] }}"
    - action: "input_boolean.turn_{{ 'on' if active else 'off' }}"
      target:
        entity_id: "input_boolean.mic_active_{{ source }}"

# ------------------------------------------------------------------------------
# 2. On-air logic: light ON while (in a meeting) OR (any mic in use), OFF
#    otherwise.
#
# REPLACE calendar.on_air_calendar with your real Microsoft 365 calendar
# entity id (find it under Developer Tools -> States, filter "calendar.").
# It appears twice below: once in the triggers, once in the template.
# ------------------------------------------------------------------------------
- id: on_air_light_control
  alias: "On-Air: calendar or mic -> light"
  description: >-
    Turns the on-air light on while a calendar event is in progress or any
    PC's microphone is in use, and off when none of those are true.
  mode: restart
  triggers:
    - trigger: state
      entity_id:
        - calendar.on_air_calendar   # REPLACE with your calendar entity
        - input_boolean.mic_active_laptop
        - input_boolean.mic_active_gaming
    # Re-evaluate after an HA restart so the light matches reality on boot.
    - trigger: homeassistant
      event: start
  actions:
    - if:
        - condition: template
          value_template: >-
            {{ is_state('calendar.on_air_calendar', 'on')
               or is_state('input_boolean.mic_active_laptop', 'on')
               or is_state('input_boolean.mic_active_gaming', 'on') }}
      then:
        # ---- TEST TARGET (before hardware arrives) -------------------------
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.on_air_test
        # ---- REAL LIGHT: once the D1 Mini is flashed, delete the two lines
        # ---- above and uncomment below. Verify the exact entity id in HA
        # ---- under Settings -> Devices & Services -> ESPHome -> On-Air Light.
        # - action: light.turn_on
        #   target:
        #     entity_id: light.on_air_light
        #   data:
        #     brightness_pct: 60
        #     rgb_color: [255, 0, 0]  # classic on-air red; [255, 170, 90] = warm white
      else:
        # ---- TEST TARGET ----------------------------------------------------
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.on_air_test
        # ---- REAL LIGHT ------------------------------------------------------
        # - action: light.turn_off
        #   target:
        #     entity_id: light.on_air_light
