# Included from configuration.yaml via `input_boolean: !include input_boolean_test.yaml`

# Stand-in for the physical light until the D1 Mini arrives. Watch it flip in
# the HA UI (add it to a dashboard, or see Settings -> Devices & Services ->
# Helpers). Safe to delete once the real light is wired in and working.
on_air_test:
  name: On Air (test light)
  icon: mdi:broadcast

# One boolean per PC running windows-mic-detector/mic_watcher.ps1. The name
# suffix must match that PC's $SourceName ("mic_active_" + source). The webhook
# automation keeps them in sync; the light automation ORs across them.
# Keep these even after the hardware arrives.
mic_active_laptop:
  name: Mic active (laptop)
  icon: mdi:microphone

mic_active_gaming:
  name: Mic active (gaming PC)
  icon: mdi:microphone
